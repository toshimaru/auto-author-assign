name: Auto Author Assign
description: 'Assign author to pull requests when the pull requests are opened.'
author: 'toshimaru'
inputs:
  repo-token:
    description: 'A token for the repository'
    default: ${{ github.token }}
  skip-users:
    description: 'Comma or newline-separated list of GitHub usernames to never assign (e.g. machine-user accounts)'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'user-plus'
  color: 'purple'
