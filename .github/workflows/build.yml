name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run package
      - name: Check Diff
        run: git diff --exit-code dist/index.js
