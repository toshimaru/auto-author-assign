version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      rollup:
        patterns:
          - rollup
          - "@rollup/rollup-*"
    ignore:
      - dependency-name: "@rollup/rollup-linux-x64-gnu"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
